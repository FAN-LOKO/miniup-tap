<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>AXIOME ИНЯЗ Tap Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <h1>FitLine Tap Demo</h1>

    <div class="stats">
      <div>Очки: <span id="score">0</span></div>
      <div>Уровень: <span id="level">1</span></div>
    </div>

    <button id="tapButton" class="tap-button">
      ТАПНИ
    </button>

    <div class="info">
      <p>Каждые 20 тапов уровень растёт, а за тап даётся больше очков.</p>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
